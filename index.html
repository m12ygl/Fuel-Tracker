    if(ph && ph.items){
      b += `<div class="card" style="padding:10px 14px 6px;margin-bottom:12px;background:var(--card2);"><div class="card-hdr" style="margin-bottom:2px;"><span class="h2" style="font-size:15px;">From your photo</span><button class="btn sm" onclick="App.addAllPhoto()">Add all</button></div>`;
      ph.items.forEach(it => { b += `<div class="row"><span class="nm"><div>${esc(it.name)}</div><small class="num">~${Math.round(it.grams)} g · ${fmt(it.kcal)} kcal · ${r1(it.protein)} g protein</small></span><button class="plus" onclick="App.addPhotoItem('${it.uid}')" aria-label="Add ${esc(it.name)}">${I.plus}</button></div>`; });
      b += `${ph.note ? `<div class="hint" style="margin:4px 0 8px;">${esc(ph.note)} These are estimates — adjust after adding if needed.</div>` : ''}</div>`;
    }
    b += `<input id="ft-name" class="field" type="text" autocomplete="off" enterkeyhint="next" placeholder="${editing ? 'Food name' : 'Search or type a food'}" oninput="App.addSearch(event)" onkeydown="if(event.key==='Enter'){event.preventDefault();App.submitAdd();}">
      <div class="flabel"><span>Nutrition${state.pendingBarcode ? ' <span class="tag">Barcode ' + esc(state.pendingBarcode) + '</span>' : ''}</span><span class="seg"><button class="${!is100?'on':''}" onclick="App.setBasis('serving')">Per serving</button><button class="${is100?'on':''}" onclick="App.setBasis('100g')">Per 100 g</button></span></div>
      <div class="grid2">
        <input id="ft-cal" class="field" type="number" inputmode="decimal" placeholder="kcal" oninput="App.updatePreview()" onkeydown="if(event.key==='Enter')App.submitAdd()">
        <input id="ft-pro" class="field" type="number" inputmode="decimal" placeholder="Protein g" oninput="App.updatePreview()" onkeydown="if(event.key==='Enter')App.submitAdd()">
      </div>
      ${macroInputs('ft-')}
      <div class="flabel"><span>${is100 ? 'Amount (grams)' : 'Servings'}</span></div>
      <div class="amts">
        ${is100 ? '' : [[0.5,'½'],[1,'1'],[1.5,'1½'],[2,'2']].map(([v,l]) => `<button class="chip" data-v="${v}" onclick="App.setAmt(${v})">${l}</button>`).join('')}
        <input id="ft-amt" class="field" type="number" inputmode="decimal" step="${is100?1:0.25}" placeholder="${is100?'e.g. 250':'1'}" oninput="App.updatePreview()" onkeydown="if(event.key==='Enter')App.submitAdd()">
        ${is100 ? '<span class="unit">g</span>' : ''}
      </div>
      <div class="actions">
        ${editing ? `<button class="btn danger" style="flex:0 0 auto;" onclick="App.deleteEditing()">Delete</button>` : ''}
        <button class="btn" id="ft-addbtn" onclick="App.submitAdd()">${editing ? 'Save' : 'Add'}</button>
      </div>`;
    if(!editing) b += `<div id="ft-results" style="margin-top:18px;">${buildAddResults()}</div>`;
    return sheet(editing ? 'Edit entry' : 'Add food' + dayNote(), b);
  }
  function foodRow(k, f, withPlus){
    const it = itemFromFood(f), t = itemTotals(it), al = amtLabel(it.basis, it.amt);
    return `<div class="row"><button class="nm" style="border:none;background:none;text-align:left;padding:0;" onclick="App.pickFood(${arg(k)})"><div>${esc(f.name)}${f.recipeId ? '<span class="tag">Recipe</span>' : ''}</div><small class="num">${al ? esc(al) + ' · ' : ''}${fmt(t.c)} kcal · ${r1(t.p)} g</small></button>${withPlus ? `<button class="plus" onclick="App.quickAddFood(${arg(k)})" aria-label="Add ${esc(f.name)}">${I.plus}</button>` : ''}</div>`;
  }
  function buildAddResults(){
    const q = state.addQ.trim().toLowerCase();
    let h = '';
    const meals = mealsList().filter(m => !q || m.name.toLowerCase().includes(q));
    if(meals.length){
      h += `<div class="label">Saved meals</div><div>`;
      meals.slice(0, q ? 5 : 4).forEach(m => { const x = sumItems(m.items);
        h += `<div class="row"><span class="nm"><div>${esc(m.name)}</div><small class="num">${m.items.length} items · ${fmt(x.c)} kcal · ${Math.round(x.p)} g</small></span><button class="plus" onclick="App.logMeal(${arg(m.id)})" aria-label="Add ${esc(m.name)}">${I.plus}</button></div>`; });
      h += `</div>`;
    }
    if(q){
      const lib = state.library;
      const keys = Object.keys(lib).filter(k => lib[k].name.toLowerCase().includes(q))
        .sort((a,b) => (lib[b].name.toLowerCase().startsWith(q)) - (lib[a].name.toLowerCase().startsWith(q)) || (lib[b].uses||0)-(lib[a].uses||0)).slice(0,10);
      h += `<div class="label">Foods</div>`;
      h += keys.length ? keys.map(k => foodRow(k, lib[k], true)).join('') : `<div class="hint">No saved food matches — fill in kcal and protein above, or scan the barcode.</div>`;
    } else {
      const recs = Object.entries(state.library).filter(([k,f]) => f.recipeId && state.recipes[f.recipeId]);
      if(recs.length){ h += `<div class="label">Recipes</div>` + recs.slice(0,4).map(([k,f]) => foodRow(k, f, true)).join(''); }
      const freq = frequentFoods(8);
      if(freq.length){ h += `<div class="label">Frequent</div>` + freq.map(([k,f]) => foodRow(k, f, true)).join(''); }
    }
    return h;
  }
  function buildSettingsSheet(){
    const b = `<div class="label">Daily targets</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px;font-size:12px;color:var(--t3);"><span>Calories</span><span>Protein (g)</span><span>Water (L)</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;"><input id="ft-tcal" class="field" type="number" inputmode="numeric" aria-label="Calorie target"><input id="ft-tpro" class="field" type="number" inputmode="numeric" aria-label="Protein target"><input id="ft-twat" class="field" type="number" inputmode="decimal" step="0.1" aria-label="Water target in litres"></div>
      ${state.targetsErr ? `<div class="err">${esc(state.targetsErr)}</div>` : ''}
      <button class="btn block soft" style="margin-top:10px;" onclick="App.saveTargets()">Save targets</button>
      <div class="label">Tracking</div>
      <button class="toggle ${state.showMacros?'on':''}" onclick="App.toggleMacros()" aria-pressed="${state.showMacros}"><span>Track carbs & fat<br><small class="muted">Optional extra fields when logging</small></span><i></i></button>
      <div class="label">Theme</div>
      <div class="themes">${THEMES.map(t => `<button class="theme ${state.theme===t.name?'on':''}" style="background:radial-gradient(120% 120% at 20% 10%, ${t.accent}, hsl(${t.h} 45% 18%));" onclick="App.pickTheme('${t.name}')">${t.name}</button>`).join('')}</div>
      <div class="label">Coach</div>
      <input id="ft-worker" class="field" type="text" inputmode="url" autocomplete="off" placeholder="Worker URL, e.g. https://fuel-coach.you.workers.dev">
      <input id="ft-token" class="field" type="password" autocomplete="off" placeholder="Access token (APP_TOKEN from your Worker)" style="margin-top:8px;">
      <button class="btn block soft" style="margin-top:10px;" onclick="App.saveWorker()">Save coach settings</button>
      <div class="hint">Your Worker sends questions and photos to Claude and keeps your API key off this device. The access token stops anyone else using it.</div>
      <div class="label">Your data</div>
      <div class="grid2"><button class="btn ghost" onclick="App.exportData()">Export backup</button><button class="btn ghost" onclick="App.triggerImport()">Import backup</button></div>
      <div class="hint">Everything is stored only in this browser. ${Number(lsGet(K.lastBackup)) ? 'Last backup: ' + new Date(Number(lsGet(K.lastBackup))).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + '.' : 'You haven’t backed up yet.'}</div>`;
    return sheet('Settings', b);
  }
  function buildCalendarSheet(){
    const {y,m} = state.calMonth, first = new Date(y,m,1), days = new Date(y,m+1,0).getDate();
    const offset = (first.getDay()+6)%7, tk = todayKey(), logged = new Set(state.loggedDates);
    let b = `<div class="cal-hdr"><button class="close" onclick="App.calMove(-1)" aria-label="Previous month">${I.left}</button><span class="h2">${first.toLocaleDateString('en-GB',{month:'long', year:'numeric'})}</span><button class="close" onclick="App.calMove(1)" aria-label="Next month">${I.right}</button></div><div class="cal-grid">`;
    ['M','T','W','T','F','S','S'].forEach(d => { b += `<div class="dw">${d}</div>`; });
    for(let i=0;i<offset;i++) b += `<div></div>`;
    for(let d=1; d<=days; d++){
      const k = keyOf(new Date(y,m,d));
      b += `<button class="${k===tk?'today':''} ${k===state.viewKey?'sel':''}" ${k>tk?'disabled':''} onclick="App.pickDay('${k}')">${d}${logged.has(k)?'<span class="d"></span>':''}</button>`;
    }
    b += `</div><div class="hint" style="text-align:center;margin-top:12px;">Dots mark days with food logged.</div>`;
    return sheet('Jump to a day', b);
  }
  function buildSaveMealSheet(){
    const checked = state.saveMeal.checked, picked = state.entries.filter(e => checked[e.id]), x = sumItems(picked.map(itemFromEntry));
    let b = `<input id="ft-ms-name" class="field" type="text" autocomplete="off" placeholder="Meal name, e.g. Usual breakfast" onkeydown="if(event.key==='Enter')App.confirmSaveMeal()">`;
    MEALS.forEach(m => {
      const items = state.entries.filter(e => (e.meal||'Snacks') === m); if(!items.length) return;
      b += `<div class="label">${m}</div>`;
      items.forEach(e => { const on = !!checked[e.id], al = e.amt != null ? amtLabel(e.basis, e.amt) : '';
        b += `<button class="pick ${on?'on':''}" onclick="App.toggleSaveItem(${arg(e.id)})" aria-pressed="${on}"><span class="box">${on ? I.check : ''}</span><span class="nm">${esc(e.name)}${al ? ' <span class="muted">' + esc(al) + '</span>' : ''}</span><span class="kc num">${fmt(e.cal)}</span></button>`; });
    });
    b += `<div class="totbox">${totalsHTML(x.c, x.p)}</div>
      <button class="btn block" style="margin-top:14px;" onclick="App.confirmSaveMeal()">Save meal (${picked.length} item${picked.length===1?'':'s'})</button>`;
    return sheet('Save as meal', b);
  }
  function buildMealSheet(){
    const x = sumItems(state.mealDraft);
    let b = `<input id="ft-me-name" class="field" type="text" autocomplete="off" placeholder="Meal name"><div class="label">Items</div><div>`;
    state.mealDraft.forEach(it => {
      b += `<div class="ing"><span class="nm"><div>${esc(it.name)}</div><small>${it.basis==='100g' ? fmt(it.baseCal)+' kcal per 100 g' : fmt(it.baseCal)+' kcal per serving'}</small></span>
        <input id="ft-mi-${it.uid}" class="field" type="number" inputmode="decimal" value="${it.amt}" oninput="App.mealDraftInput()" aria-label="Amount of ${esc(it.name)}"><span class="u">${it.basis==='100g'?'g':'×'}</span>
        <button class="x" onclick="App.removeMealItem('${it.uid}')" aria-label="Remove ${esc(it.name)}">${I.x}</button></div>`;
    });
    b += `</div><div class="totbox" id="ft-me-total">${totalsHTML(x.c, x.p)}</div>
      <div class="actions"><button class="btn danger" style="flex:0 0 auto;" onclick="App.deleteMeal()">Delete</button><button class="btn" onclick="App.saveMealEdit()">Save meal</button></div>`;
    return sheet('Edit meal', b);
  }
  function buildRecipeSheet(){
    const d = state.recipeDraft, t = sumItems(d.items), s = Math.max(1, d.servings||1), isNew = state.recipeEdit === '__new';
    let b = `<input id="ft-rc-name" class="field" type="text" autocomplete="off" placeholder="Recipe name, e.g. Chicken traybake">
      <div class="flabel"><span>Portions it makes</span></div>
      <input id="ft-rc-serv" class="field" type="number" inputmode="decimal" min="1" step="1" placeholder="4" oninput="App.recipeInput()" style="max-width:120px;">
      <div class="label">Ingredients (${d.items.length})</div><div>`;
    if(!d.items.length) b += `<div class="hint" style="margin:0 0 6px;">Add everything that goes in the pot, at the amounts for the whole batch.</div>`;
    d.items.forEach(it => {
      b += `<div class="ing"><span class="nm"><div>${esc(it.name)}</div><small>${it.basis==='100g' ? fmt(it.baseCal)+' kcal / 100 g' : fmt(it.baseCal)+' kcal / serving'}</small></span>
        <input id="ft-ri-${it.uid}" class="field" type="number" inputmode="decimal" value="${it.amt}" oninput="App.recipeInput()" aria-label="Amount of ${esc(it.name)}"><span class="u">${it.basis==='100g'?'g':'×'}</span>
        <button class="x" onclick="App.removeRecipeItem('${it.uid}')" aria-label="Remove ${esc(it.name)}">${I.x}</button></div>`;
    });
    b += `</div><div class="totbox" id="ft-rc-total">${recipeTotalsHTML(t, s)}</div>
      <div class="label">Add ingredient</div>
      <input id="ft-rc-q" class="field" type="text" autocomplete="off" placeholder="Search your saved foods" oninput="App.recipeSearch(event)">
      <div id="ft-rc-results">${buildRecipeResults()}</div>
      <div class="flabel" style="margin-top:16px;"><span>Or a new ingredient (per 100 g)</span></div>
      <input id="ft-rc-cn" class="field" type="text" autocomplete="off" placeholder="Name, e.g. Passata">
      <div class="grid2" style="margin-top:8px;grid-template-columns:1fr 1fr auto;"><input id="ft-rc-cc" class="field" type="number" inputmode="decimal" placeholder="kcal"><input id="ft-rc-cp" class="field" type="number" inputmode="decimal" placeholder="Protein g"><button class="btn soft" onclick="App.addCustomIngredient()">Add</button></div>
      ${state.showMacros ? `<div class="grid2" style="margin-top:8px;"><input id="ft-rc-cb" class="field" type="number" inputmode="decimal" placeholder="Carbs g"><input id="ft-rc-cf" class="field" type="number" inputmode="decimal" placeholder="Fat g"></div>` : ''}
      <div class="actions">${!isNew ? `<button class="btn danger" style="flex:0 0 auto;" onclick="App.deleteRecipe()">Delete</button>` : ''}<button class="btn" onclick="App.saveRecipe()">Save recipe</button></div>`;
    return sheet(isNew ? 'New recipe' : 'Edit recipe', b);
  }
  function buildRecipeResults(){
    const q = state.recipeQ.trim().toLowerCase(), lib = state.library;
    if(!q) return '';
    const keys = Object.keys(lib).filter(k => !lib[k].recipeId && lib[k].name.toLowerCase().includes(q)).slice(0,8);
    if(!keys.length) return `<div class="hint">No saved food matches — add it as a new ingredient below.</div>`;
    return keys.map(k => { const f = lib[k];
      return `<button class="row" onclick="App.addRecipeItem(${arg(k)})"><span class="nm"><div>${esc(f.name)}</div><small>${fmt(f.cal)} kcal · ${r1(f.pro)} g ${f.basis==='100g'?'per 100 g':'per serving'}</small></span><span class="plus">${I.plus}</span></button>`; }).join('');
  }
  function buildFoodSheet(){
    const is100 = state.feBasis === '100g', isNew = state.foodEdit === '__new';
    const b = `<input id="ft-fe-name" class="field" type="text" autocomplete="off" placeholder="Food name">
      <div class="flabel"><span>Nutrition</span><span class="seg"><button class="${!is100?'on':''}" onclick="App.setFeBasis('serving')">Per serving</button><button class="${is100?'on':''}" onclick="App.setFeBasis('100g')">Per 100 g</button></span></div>
      <div class="grid2"><input id="ft-fe-cal" class="field" type="number" inputmode="decimal" placeholder="kcal"><input id="ft-fe-pro" class="field" type="number" inputmode="decimal" placeholder="Protein g"></div>
      ${macroInputs('ft-fe-')}
      ${!is100 ? `<div class="flabel"><span>Convert to per 100 g</span></div>
        <div style="display:flex;gap:8px;align-items:center;"><span class="sub" style="flex:1;">This serving weighs</span><input id="ft-fe-g" class="field" type="number" inputmode="decimal" placeholder="g" style="width:90px;"><button class="btn soft" onclick="App.convertFood()">Convert</button></div>` : ''}
      <div class="hint">${is100 ? 'Per-100 g foods ask for grams when you log them, so one entry covers any portion.' : 'Saved at several weights? Convert one to per 100 g, then delete the others.'}</div>
      <div class="actions">${!isNew ? `<button class="btn danger" style="flex:0 0 auto;" onclick="App.deleteFood()">Delete</button>` : ''}<button class="btn" onclick="App.saveFood()">Save food</button></div>`;
    return sheet(isNew ? 'New food' : 'Edit food', b);
  }

  // ======================================================================
  // Public API (used by inline handlers)
  // ======================================================================
  window.App = {
    setTab(t){ fresh.page = state.tab !== t; state.tab = t; state.sheet = null; render(); window.scrollTo(0,0); if(t === 'coach') scrollChat(); },
    setMealsTab(t){ state.mealsTab = t; state.foodQ = ''; render(); },
    goDay(n){ setDay(shiftKey(state.viewKey, n)); }, pickDay: setDay,
    calMove(n){ const d = new Date(state.calMonth.y, state.calMonth.m + n, 1); state.calMonth = { y:d.getFullYear(), m:d.getMonth() }; render(); },
    openSheet, closeSheet, openSettings,
    openAdd, openEditEntry, setAddMeal, setBasis, setAmt, updatePreview, submitAdd, deleteEditing, pickFood, quickAddFood, addSearch, copyPrevDay,
    openScanner, closeScanner, lookupTyped,
    triggerPhoto, onPhoto, addPhotoItem, addAllPhoto,
    openSaveMeal, toggleSaveItem, confirmSaveMeal, logMeal, openMealEdit, mealDraftInput, removeMealItem, saveMealEdit, deleteMeal,
    openRecipe, recipeInput, recipeSearch, addRecipeItem, addCustomIngredient, removeRecipeItem, saveRecipe, deleteRecipe, logRecipe,
    openFood, setFeBasis, convertFood, saveFood, deleteFood, foodSearch,
    saveWeight, addWater, chartHover, chartLeave,
    saveTargets, pickTheme, toggleMacros, saveWorker, exportData, triggerImport, importFile, snoozeBackup,
    setTrend(m){ state.trendMode = m; render(); },
    ask, reviewWeek, clearChat(){ state.chat = []; render(); },
    undo
  };

  // roll over to the new day if the app is left open past midnight
  let lastToday = todayKey();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible') return;
    const now = todayKey();
    if(now !== lastToday){ if(state.viewKey === lastToday) setDay(now); else render(); lastToday = now; }
  });
  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    if(!$('scanner').hidden) closeScanner(); else if(state.sheet) closeSheet();
  });

  init();
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(e => console.warn('SW registration failed', e)); });
}
</script>
</body>
</html>
