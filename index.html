<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Tracker</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<link rel="apple-touch-icon" href="icon-180-v4.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg,#0c0e12);}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--t1,#f3f4f6);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1,'cv11' 1;}
  body.lock{overflow:hidden;}
  button,input{font-family:inherit;font-feature-settings:inherit;color:inherit;}
  button{cursor:pointer;}
  input{font-size:16px !important;}           /* stops iOS zooming in on focus */
  ::placeholder{color:#5f6673;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @keyframes up{from{transform:translateY(16px);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes sheetin{from{transform:translateY(40px);opacity:0.4;}to{transform:none;opacity:1;}}
  @keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}

  #app{min-height:100vh;background:var(--bg);}
  .glow{position:absolute;top:0;left:0;right:0;height:320px;background:var(--glow);pointer-events:none;}
  .page{position:relative;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 112px);}
  .page.enter{animation:up .25s ease;}

  /* ---------- type ---------- */
  .eyebrow{font-size:13px;font-weight:500;color:var(--t2);}
  .title{font-size:30px;font-weight:800;letter-spacing:-0.6px;line-height:1.1;margin:2px 0 0;}
  .h2{font-size:17px;font-weight:700;letter-spacing:-0.2px;}
  .sub{font-size:13px;color:var(--t2);}
  .muted{color:var(--t3);}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- header ---------- */
  .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .datenav{display:flex;align-items:center;gap:2px;margin-left:-8px;}
  .datenav button{width:30px;height:30px;border:none;background:none;color:var(--t2);border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .datenav button:disabled{opacity:.25;cursor:default;}
  .datenav span{font-size:13px;font-weight:500;color:var(--t2);}
  .iconbtns{display:flex;gap:8px;}
  .ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--t2);display:flex;align-items:center;justify-content:center;}
  .todaylink{border:none;background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;margin-left:6px;}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;}
  .card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:none;background:none;color:var(--t2);font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;}
  .seg button.on{background:var(--accent);color:var(--ink);}
  .seg.full{display:flex;width:100%;}
  .seg.full button{flex:1;padding:8px 4px;}

  /* ---------- summary ---------- */
  .summary{display:flex;flex-direction:column;align-items:center;padding:22px 18px 18px;}
  .ringwrap{position:relative;width:196px;height:196px;}
  .ringwrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ringtxt .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;}
  .ringtxt .lbl{font-size:13px;color:var(--t2);margin-top:6px;}
  .sumrow{display:grid;grid-template-columns:1fr 1fr 1fr;width:100%;margin-top:18px;text-align:center;}
  .sumrow .k{font-size:12px;color:var(--t2);}
  .sumrow .v{font-size:17px;font-weight:700;margin-top:2px;}
  .probar{width:100%;margin-top:18px;}
  .probar .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .probar .row b{font-weight:600;}
  .macros{display:flex;justify-content:center;gap:22px;width:100%;margin-top:14px;font-size:13px;color:var(--t2);}
  .macros b{color:var(--t1);font-weight:600;}
  .track{height:8px;border-radius:4px;background:var(--track);overflow:hidden;}
  .fill{height:100%;border-radius:4px;transition:width .35s ease;}

  /* water */
  .water{display:flex;align-items:center;gap:12px;padding:14px 16px;}
  .water .wi{flex:1;min-width:0;}
  .water .wi .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px;}
  .water .wi .row span:first-child{font-weight:600;}
  .wbtn{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:none;background:var(--card2);color:var(--t1);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .wbtn.add{background:var(--accentSoft);color:var(--accent);width:auto;flex:0 0 auto;padding:0 12px;font-size:13.5px;white-space:nowrap;}
  .wbtn:disabled{opacity:.35;}

  /* gap suggestions + banners */
  .gap .row .kc{color:var(--t2);font-weight:500;}
  .banner{display:flex;gap:12px;align-items:center;background:var(--accentSoft);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:14px;}
  .banner span{flex:1;}
  .banner .btn{flex-shrink:0;}

  /* ---------- meal cards ---------- */
  .meal{padding:14px 16px 6px;}
  .meal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .meal-hdr .h2{font-size:16px;}
  .meal-hdr .tot{font-size:13px;color:var(--t2);margin-left:8px;font-weight:500;}
  .addbtn{width:32px;height:32px;border-radius:10px;border:none;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .swipe{position:relative;overflow:hidden;border-top:1px solid var(--line);}
  .swipe:first-of-type{border-top:none;}
  .swipe-bg{position:absolute;inset:0;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-size:13.5px;font-weight:600;}
  .entry{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:none;padding:11px 0;text-align:left;touch-action:pan-y;}
  .entry .nm{flex:1;min-width:0;}
  .entry .nm div{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .nm small{display:block;font-size:12px;color:var(--t3);margin-top:2px;}
  .entry .kc{font-size:14px;font-weight:600;white-space:nowrap;}
  .meal-empty{font-size:13px;color:var(--t3);padding:6px 0 12px;}
  .meal-foot{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding:8px 0 4px;}
  .link{border:none;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 0;}
  .link.quiet{color:var(--t2);font-weight:500;}
  .copybtn{display:block;width:100%;border:1px dashed var(--line2);background:none;color:var(--t2);font-size:13.5px;font-weight:500;padding:13px;border-radius:16px;margin-bottom:14px;}

  .fab{position:fixed;right:max(18px, calc(50vw - 242px));bottom:calc(env(safe-area-inset-bottom,0px) + 82px);width:58px;height:58px;border-radius:20px;border:none;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px var(--accentShadow);z-index:30;}

  /* ---------- tab bar ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--barbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
  .tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
  .tabbar button{border:none;background:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;}
  .tabbar button.on{color:var(--accent);}

  /* ---------- lists ---------- */
  .row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-top:1px solid var(--line);padding:12px 0;text-align:left;}
  .row:first-child{border-top:none;}
  .row .nm{flex:1;min-width:0;}
  .row .nm div{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .nm small{display:block;font-size:12px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .kc{font-size:13.5px;font-weight:600;white-space:nowrap;}
  .plus{flex:0 0 34px;width:34px;height:34px;border-radius:10px;border:none;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accentSoft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;}
  .label{font-size:13px;font-weight:600;color:var(--t2);margin:18px 0 6px;}
  .label:first-child{margin-top:4px;}
  .empty{text-align:center;color:var(--t3);font-size:13.5px;line-height:1.55;padding:26px 10px;}

  /* meals / recipes page cards */
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;}
  .mcard .tp{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .mcard .tp button.nmb{flex:1;min-width:0;border:none;background:none;text-align:left;padding:0;}
  .mcard .nmb div{font-size:16px;font-weight:700;letter-spacing:-0.2px;}
  .mcard .nmb small{display:block;font-size:12.5px;color:var(--t2);margin-top:3px;}
  .mcard .items{font-size:12.5px;color:var(--t3);margin-top:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .mcard .stats{display:flex;gap:16px;margin-top:12px;}
  .mcard .stats div{font-size:12px;color:var(--t2);}
  .mcard .stats b{display:block;font-size:16px;color:var(--t1);font-weight:700;margin-top:1px;}
  .btn{border:none;background:var(--accent);color:var(--ink);font-size:14px;font-weight:700;padding:12px 16px;border-radius:13px;white-space:nowrap;}
  .btn.sm{font-size:13px;padding:8px 13px;border-radius:11px;}
  .btn.soft{background:var(--accentSoft);color:var(--accent);}
  .btn.ghost{background:var(--card2);color:var(--t1);}
  .btn.danger{background:var(--card2);color:var(--warn);}
  .btn.block{display:block;width:100%;}
  .btn:disabled{opacity:.5;}
  .newbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--line2);background:none;color:var(--accent);font-size:14px;font-weight:600;padding:14px;border-radius:18px;margin-bottom:14px;}

  /* ---------- forms ---------- */
  .field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--t1);}
  .field:focus{border-color:var(--accent);outline:none;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .flabel{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--t2);margin:14px 0 7px;}
  .amts{display:flex;gap:6px;align-items:center;}
  .amts .chip{flex:0 0 auto;min-width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--t2);font-size:15px;font-weight:600;}
  .amts .chip.on{border-color:var(--accent);color:var(--accent);background:var(--accentSoft);}
  .amts input{flex:1;min-width:0;}
  .amts .unit{font-size:13px;color:var(--t2);margin-left:2px;}
  .actions{display:flex;gap:8px;margin-top:16px;}
  .actions .btn{flex:1;}
  .hint{font-size:12.5px;color:var(--t3);line-height:1.5;margin-top:8px;}
  .err{font-size:12.5px;color:var(--warn);margin-top:8px;}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .tools button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:11px;font-size:13.5px;font-weight:600;color:var(--t1);}
  .tools button svg{color:var(--accent);}
  .status{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:13px;padding:12px 14px;font-size:13.5px;color:var(--t2);margin-bottom:12px;}
  .status.busy{animation:pulse 1.2s infinite;}
  .toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card2);border:none;border-radius:13px;padding:12px 14px;font-size:14px;color:var(--t1);text-align:left;}
  .toggle i{width:42px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex-shrink:0;transition:background .2s;}
  .toggle i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:transform .2s;}
  .toggle.on i{background:var(--accent);}
  .toggle.on i::after{transform:translateX(16px);}

  /* ---------- sheets ---------- */
  .backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.55);}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:520px;margin:0 auto;background:var(--sheet);border-radius:26px 26px 0 0;border-top:1px solid var(--line);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -24px 60px rgba(0,0,0,0.5);}
  .sheet.enter{animation:sheetin .22s ease;}
  .sheet .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,0.16);margin:9px auto 4px;flex-shrink:0;}
  .sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 12px;flex-shrink:0;}
  .sheet .sh .h2{font-size:19px;}
  .sheet .close{width:32px;height:32px;border-radius:10px;border:none;background:var(--card2);color:var(--t2);display:flex;align-items:center;justify-content:center;}
  .sheet .sb{overflow-y:auto;padding:2px 18px calc(env(safe-area-inset-bottom,0px) + 22px);min-height:0;}

  /* ingredient rows */
  .ing{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0;}
  .ing:first-child{border-top:none;}
  .ing .nm{flex:1;min-width:0;font-size:14px;}
  .ing .nm small{display:block;font-size:11.5px;color:var(--t3);margin-top:1px;}
  .ing .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ing input{width:74px;flex:0 0 74px;padding:8px 10px;}
  .ing .u{font-size:12px;color:var(--t2);width:16px;}
  .ing .x{width:30px;height:30px;border:none;background:none;color:var(--t3);display:flex;align-items:center;justify-content:center;}
  .totbox{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:12px;display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--t2);}
  .totbox b{display:block;font-size:16px;color:var(--t1);margin-top:2px;}
  .pick{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-top:1px solid var(--line);padding:11px 0;text-align:left;}
  .pick .box{flex:0 0 22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .pick.on .box{background:var(--accent);border-color:var(--accent);}
  .pick .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pick .kc{font-size:12.5px;color:var(--t2);}

  /* calendar */
  .cal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-grid .dw{font-size:11px;color:var(--t3);text-align:center;padding-bottom:4px;font-weight:600;}
  .cal-grid button{aspect-ratio:1/1;border:none;background:none;border-radius:12px;font-size:14px;color:var(--t1);position:relative;}
  .cal-grid button:disabled{color:var(--t3);opacity:.4;}
  .cal-grid button.today{box-shadow:inset 0 0 0 1px var(--line2);}
  .cal-grid button.sel{background:var(--accent);color:var(--ink);font-weight:700;}
  .cal-grid button .d{position:absolute;bottom:6px;left:50%;width:4px;height:4px;border-radius:2px;background:var(--accent);transform:translateX(-50%);}
  .cal-grid button.sel .d{background:var(--ink);}

  /* themes */
  .themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .theme{border:none;border-radius:16px;aspect-ratio:1/1;position:relative;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;color:#fff;}
  .theme.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff;}

  /* ---------- progress ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .tile{background:var(--card2);border-radius:16px;padding:12px;}
  .tile .k{font-size:11.5px;color:var(--t2);font-weight:500;}
  .tile .v{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-top:4px;}
  .tile .v small{font-size:13px;font-weight:600;color:var(--t3);}
  .tile .s{font-size:11.5px;color:var(--t3);margin-top:2px;}
  .bars{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;height:120px;}
  .tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--t3);opacity:.45;pointer-events:none;}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;background:none;border:none;padding:0;}
  .barwrap{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;}
  .bar{width:68%;max-width:26px;border-radius:6px;}
  .barcol span{font-size:11.5px;color:var(--t3);font-weight:500;}
  .barcol span.on{color:var(--t1);font-weight:700;}
  .foot{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--t2);}
  .wrow{display:flex;gap:8px;align-items:center;}
  .wrow input{flex:1;}
  .wsum{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 2px;font-size:13px;color:var(--t2);}
  .wsum b{color:var(--t1);font-weight:700;}
  .chartwrap{position:relative;margin-top:10px;}
  .chartwrap svg{display:block;width:100%;height:auto;touch-action:pan-y;}
  .tip{position:absolute;top:2px;pointer-events:none;background:rgba(243,244,246,0.97);color:#111;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.4;white-space:nowrap;transform:translateX(-50%);display:none;box-shadow:0 6px 18px rgba(0,0,0,0.4);}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--t2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .review{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:16px;text-align:left;margin-bottom:14px;}
  .review .ic{width:40px;height:40px;border-radius:12px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .review div{flex:1;}
  .review b{display:block;font-size:15px;}
  .review small{font-size:12.5px;color:var(--t2);}

  /* ---------- coach ---------- */
  .coachpage{display:flex;flex-direction:column;min-height:calc(100vh - 140px);}
  .chat{flex:1;display:flex;flex-direction:column;gap:10px;padding:6px 0 16px;}
  .bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;}
  .bub.me{align-self:flex-end;background:var(--accent);color:var(--ink);border-bottom-right-radius:6px;}
  .bub.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;}
  .bub.sys{align-self:center;background:none;color:var(--t3);font-size:13px;text-align:center;padding:4px 10px;}
  .bub.load{align-self:flex-start;color:var(--t2);background:none;animation:pulse 1.2s infinite;}
  .prompts{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .prompts button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-size:14px;color:var(--t1);}
  .composer{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:flex;gap:8px;padding:10px 0 4px;background:linear-gradient(transparent, var(--bg) 30%);}
  .composer input{flex:1;border-radius:16px;}
  .send{width:48px;flex:0 0 48px;border:none;border-radius:16px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .send:disabled{opacity:.45;}

  .toast{position:fixed;left:18px;right:18px;max-width:484px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:90;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#f3f4f6;color:#111;border-radius:14px;padding:11px 12px 11px 16px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,0.45);}
  .toast.enter{animation:up .2s ease;}
  .toast button{border:none;background:none;color:#1d4ed8;font-weight:700;font-size:14px;padding:2px 4px;}

  /* ---------- barcode scanner (lives outside #app so re-renders never touch the camera) ---------- */
  .scanner{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;}
  .scanner[hidden]{display:none;}
  .scan-top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;color:#fff;font-size:17px;font-weight:700;}
  .scan-top button{width:36px;height:36px;border-radius:12px;border:none;background:rgba(255,255,255,0.14);color:#fff;display:flex;align-items:center;justify-content:center;}
  #ft-reader{flex:1;min-height:0;overflow:hidden;position:relative;}
  #ft-reader video{width:100% !important;height:100% !important;object-fit:cover;}
  .scan-frame{position:absolute;left:50%;top:45%;width:min(78vw,340px);height:150px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,0.85);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,0.35);pointer-events:none;z-index:2;}
  .scan-bottom{background:var(--sheet);border-radius:24px 24px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);}
  .scan-status{font-size:14px;color:var(--t2);margin-bottom:12px;text-align:center;min-height:20px;}
  .scan-manual{display:flex;gap:8px;}
</style>
</head>
<body>
<div id="app"></div>

<div id="scanner" class="scanner" hidden>
  <div class="scan-top"><span>Scan a barcode</span><button onclick="App.closeScanner()" aria-label="Close scanner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="ft-reader"><div class="scan-frame"></div></div>
  <div class="scan-bottom">
    <div class="scan-status" id="scan-status">Starting camera…</div>
    <div class="scan-manual"><input id="scan-code" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="Or type the barcode number" onkeydown="if(event.key==='Enter')App.lookupTyped()"><button class="btn" onclick="App.lookupTyped()">Look up</button></div>
  </div>
</div>
<input type="file" id="ft-photo" accept="image/*" capture="environment" style="display:none" onchange="App.onPhoto(event)">
<input type="file" id="ft-import" accept="application/json,.json" style="display:none" onchange="App.importFile(event)">

<script>
(function(){
  // ======================================================================
  // Themes: 8 curated accents. `pro` colours protein and weigh-in dots; each
  // accent/pro pair was checked for colour-blind and normal-vision separation.
  // ======================================================================
  const THEMES = [
    { name:'Ocean',    h:218, accent:'#4d8dff', pro:'#ff5ea8' },
    { name:'Steel',    h:205, accent:'#38bdf8', pro:'#f59e0b' },
    { name:'Mint',     h:160, accent:'#10b981', pro:'#5eead4' },
    { name:'Nebula',   h:262, accent:'#8b5cf6', pro:'#22d3ee' },
    { name:'Sunset',   h:22,  accent:'#ff8a3d', pro:'#ff5ea8' },
    { name:'Ember',    h:350, accent:'#f43f5e', pro:'#fbbf24' },
    { name:'Midnight', h:236, accent:'#6366f1', pro:'#34d399' },
    { name:'Lime',     h:85,  accent:'#a3e635', pro:'#22d3ee' }
  ];
  // the old 24 themes map onto the closest new one
  const OLD_THEME_MAP = ['Ocean','Mint','Nebula','Sunset','Ember','Mint','Sunset','Midnight','Ember','Steel','Lime','Sunset','Nebula','Steel','Nebula','Sunset','Mint','Ocean','Ember','Sunset','Mint','Nebula','Steel','Steel'];
  function theme(){ return THEMES.find(t => t.name === state.theme) || THEMES[0]; }
  function hexA(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
  function themeVars(){
    const t = theme(), h = t.h;
    return [
      `--bg:hsl(${h} 14% 5.5%)`, `--card:hsl(${h} 12% 9.5%)`, `--card2:hsl(${h} 11% 13%)`, `--sheet:hsl(${h} 12% 10.5%)`,
      `--line:hsl(${h} 10% 15.5%)`, `--line2:hsl(${h} 10% 24%)`, `--track:hsl(${h} 10% 15%)`,
      `--barbg:hsla(${h},14%,6%,0.86)`,
      `--glow:radial-gradient(90% 100% at 50% 0%, ${hexA(t.accent,0.16)}, transparent 70%)`,
      `--accent:${t.accent}`, `--accentSoft:${hexA(t.accent,0.14)}`, `--accentShadow:${hexA(t.accent,0.35)}`,
      `--pro:${t.pro}`, `--warn:#fb7185`, `--ink:hsl(${h} 40% 8%)`,
      `--t1:#f3f4f6`, `--t2:#a3a9b5`, `--t3:#6b7180`
    ].join(';');
  }

  // ======================================================================
  // Storage (keys unchanged from earlier versions, so existing data loads)
  // ======================================================================
  const K = { targets:'fuel-targets', library:'fuel-food-library', theme:'fuel-theme', themeName:'fuel-theme-name',
              weights:'fuel-weights', meals:'fuel-meals', recipes:'fuel-recipes', water:'fuel-water',
              worker:'fuel-ai-worker-url', token:'fuel-ai-token', macros:'fuel-show-macros',
              lastBackup:'fuel-last-backup', backupSnooze:'fuel-backup-snooze' };
  const entryKey = (k) => 'fuel-entries:'+k;
  const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
  const DAY_MS = 86400000;
  const MODEL = 'claude-sonnet-5';
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
  function lsRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function lsJSON(k, fallback){ const r = lsGet(k); if(r){ try{ const v = JSON.parse(r); if(v != null) return v; }catch(e){} } return fallback; }

  function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parseKey(k){ const [y,m,dd]=k.split('-').map(Number); return new Date(y, m-1, dd); }
  function todayKey(){ return keyOf(new Date()); }
  function shiftKey(k, n){ const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
  function shortDate(k){ return parseKey(k).toLocaleDateString('en-GB',{day:'numeric', month:'short'}); }
  function longDate(k){ return parseKey(k).toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}); }
  function defaultMeal(){ const h=new Date().getHours(); if(h<11) return 'Breakfast'; if(h<15) return 'Lunch'; if(h<21) return 'Dinner'; return 'Snacks'; }
  const r1 = (x) => Math.round(x*10)/10;
  const fmt = (x) => Math.round(x).toLocaleString('en-GB');
  const fmtAmt = (x) => Number.isInteger(x) ? String(x) : String(r1(x));
  const uid = () => Math.random().toString(36).slice(2,9);
  const num = (v) => { const n = Number(v); return v === '' || v == null || isNaN(n) ? undefined : n; };
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const arg = (s) => esc(JSON.stringify(String(s)));   // safe string argument inside onclick="..."
  function buzz(){ try{ if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8); }catch(e){} }   // Android only; iPhones don't allow web haptics

  // ======================================================================
  // State
  // ======================================================================
  const state = {
    ready:false, tab:'today', mealsTab:'meals',
    targets:{ calories:1800, protein:150, water:2500 },
    library:{}, meals:{}, recipes:{}, weights:{}, water:{},
    entries:[], loggedDates:[], viewKey:null, calMonth:null,
    theme:'Ocean', showMacros:false,
    workerUrl: lsGet(K.worker) || '', token: lsGet(K.token) || '',
    sheet:null,            // 'add' | 'settings' | 'calendar' | 'saveMeal' | 'food' | 'meal' | 'recipe'
    addMeal:null, editId:null, formBasis:'serving', addQ:'', pendingBarcode:null,
    photo:null,            // { busy } | { items, note } | { error }
    foodQ:'', foodEdit:null, feBasis:'serving',
    saveMeal:null, mealEdit:null, mealDraft:null,
    recipeEdit:null, recipeDraft:null, recipeQ:'',
    trendMode:'cal', targetsErr:'',
    chat:[], asking:false, toast:null
  };

  // ---------- entries ----------
  function loadEntries(k){ const v = lsJSON(entryKey(k), []); return Array.isArray(v) ? v : []; }
  function saveEntriesFor(k, es){ if(es.length) lsSet(entryKey(k), JSON.stringify(es)); else lsRemove(entryKey(k)); }
  function scanLoggedDates(){
    const out = [];
    try{ for(let i=0;i<localStorage.length;i++){ const key = localStorage.key(i); if(key && key.indexOf('fuel-entries:')===0) out.push(key.slice(13)); } }catch(e){}
    return out;
  }
  function persistEntries(es){
    saveEntriesFor(state.viewKey, es);
    state.entries = es;
    state.loggedDates = scanLoggedDates();
    render();
  }
  const saveLibrary = (l) => { lsSet(K.library, JSON.stringify(l)); state.library = l; };
  const saveMeals   = (m) => { lsSet(K.meals, JSON.stringify(m)); state.meals = m; };
  const saveRecipes = (r) => { lsSet(K.recipes, JSON.stringify(r)); state.recipes = r; };
  const saveWeights = (w) => { lsSet(K.weights, JSON.stringify(w)); state.weights = w; };
  const saveWater   = (w) => { lsSet(K.water, JSON.stringify(w)); state.water = w; };

  // Library foods store BASE values: per serving, or per 100 g when basis === '100g'.
  // base = { cal, pro, carb?, fat? }
  function rememberFood(name, base, basis, amt, extra){
    const lib = { ...state.library };
    const k = name.toLowerCase();
    const prev = lib[k] || {};
    const f = { ...prev, ...(extra||{}), name, cal:base.cal, pro:base.pro, basis: basis || 'serving', lastAmt: amt, uses:(prev.uses||0)+1, last:Date.now() };
    if(base.carb != null) f.carb = base.carb;
    if(base.fat != null) f.fat = base.fat;
    lib[k] = f;
    saveLibrary(lib);
  }

  // ---------- portions ----------
  // An "item" is a food at an amount: { name, baseCal, basePro, baseCarb?, baseFat?, basis, amt }
  const factorFor = (basis, amt) => basis === '100g' ? amt/100 : amt;
  const defaultAmt = (f) => f && f.lastAmt ? f.lastAmt : (f && f.basis === '100g' ? 100 : 1);
  function amtLabel(basis, amt){ if(basis === '100g') return fmtAmt(amt) + ' g'; return amt === 1 ? '' : '×' + fmtAmt(amt); }
  function makeEntry(it, meal, extra){
    const f = factorFor(it.basis, it.amt);
    const e = { id: Date.now()+'-'+uid(), name:it.name, meal, cal: Math.round(it.baseCal*f), pro: r1(it.basePro*f), basis:it.basis, amt:it.amt, baseCal:it.baseCal, basePro:it.basePro, ...(extra||{}) };
    if(it.baseCarb != null){ e.baseCarb = it.baseCarb; e.carb = r1(it.baseCarb*f); }
    if(it.baseFat != null){ e.baseFat = it.baseFat; e.fat = r1(it.baseFat*f); }
    return e;
  }
  function itemFromEntry(e){
    const it = { name:e.name, baseCal: e.baseCal != null ? e.baseCal : Number(e.cal||0), basePro: e.basePro != null ? e.basePro : Number(e.pro||0), basis: e.basis || 'serving', amt: e.amt != null ? e.amt : 1 };
    if(e.baseCarb != null) it.baseCarb = e.baseCarb;
    if(e.baseFat != null) it.baseFat = e.baseFat;
    return it;
  }
  function itemFromFood(f, amt){
    const it = { name:f.name, baseCal:Number(f.cal)||0, basePro:Number(f.pro)||0, basis:f.basis||'serving', amt: amt != null ? amt : defaultAmt(f) };
    if(f.carb != null) it.baseCarb = Number(f.carb);
    if(f.fat != null) it.baseFat = Number(f.fat);
    return it;
  }
  function itemTotals(it){ const f = factorFor(it.basis, it.amt); return { c: it.baseCal*f, p: it.basePro*f, cb:(it.baseCarb||0)*f, f:(it.baseFat||0)*f }; }
  function sumItems(items){ return items.reduce((s,it) => { const t = itemTotals(it); return { c:s.c+t.c, p:s.p+t.p, cb:s.cb+t.cb, f:s.f+t.f }; }, { c:0, p:0, cb:0, f:0 }); }

  // ---------- toast / undo ----------
  const fresh = { page:true, sheet:false, toast:false };   // animations play only when something first appears
  let toastTimer = null;
  function toast(text, undo){
    state.toast = { text, undo: undo || null };
    fresh.toast = true;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.toast = null; render(); }, undo ? 5000 : 2600);
  }
  function entriesUndo(key, es){ return () => { saveEntriesFor(key, es); if(key === state.viewKey) state.entries = es; state.loggedDates = scanLoggedDates(); }; }
  function undo(){ const t = state.toast; if(!t || !t.undo) return; t.undo(); clearTimeout(toastTimer); state.toast = null; render(); }

  // ======================================================================
  // Init
  // ======================================================================
  function readStored(){
    let targets = lsJSON(K.targets, null);
    if(!(targets && targets.calories > 0 && targets.protein > 0)) targets = { calories:1800, protein:150 };
    if(!(targets.water > 0)) targets = { ...targets, water:2500 };
    let themeName = lsGet(K.themeName);
    if(!THEMES.some(t => t.name === themeName)){
      const old = Number(lsGet(K.theme));
      themeName = (lsGet(K.theme) !== null && !isNaN(old)) ? (OLD_THEME_MAP[old] || 'Ocean') : 'Ocean';
    }
    return { targets, library: lsJSON(K.library, {}), meals: lsJSON(K.meals, {}), recipes: lsJSON(K.recipes, {}),
             weights: lsJSON(K.weights, {}), water: lsJSON(K.water, {}), themeName, showMacros: lsGet(K.macros) === '1' };
  }
  // Older saved foods have no usage counts; work them out once from history.
  function backfillUsage(lib){
    const missing = Object.keys(lib).filter(k => lib[k] && lib[k].uses == null);
    if(!missing.length) return lib;
    const counts = {};
    scanLoggedDates().forEach(day => {
      const ts = parseKey(day).getTime();
      loadEntries(day).forEach(e => { const k = String(e.name||'').toLowerCase(); counts[k] = counts[k] || { uses:0, last:0 }; counts[k].uses++; counts[k].last = Math.max(counts[k].last, ts); });
    });
    const out = { ...lib };
    missing.forEach(k => { out[k] = { ...out[k], uses:(counts[k]||{}).uses||0, last:(counts[k]||{}).last||0 }; });
    lsSet(K.library, JSON.stringify(out));
    return out;
  }
  function applyStored(){
    const s = readStored();
    state.targets = s.targets; state.library = backfillUsage(s.library);
    state.meals = s.meals; state.recipes = s.recipes; state.weights = s.weights; state.water = s.water;
    state.theme = s.themeName; state.showMacros = s.showMacros;
    state.entries = loadEntries(state.viewKey); state.loggedDates = scanLoggedDates();
  }
  function init(){
    state.viewKey = todayKey();
    const now = new Date();
    state.calMonth = { y: now.getFullYear(), m: now.getMonth() };
    applyStored();
    state.ready = true;
    render();
  }

  // ======================================================================
  // Day navigation
  // ======================================================================
  function setDay(k){
    if(k > todayKey()) return;
    const d = parseKey(k);
    state.viewKey = k; state.entries = loadEntries(k);
    state.calMonth = { y:d.getFullYear(), m:d.getMonth() };
    if(state.sheet === 'calendar') state.sheet = null;
    render();
  }

  // ======================================================================
  // Totals, streak, weekly stats, weight trend
  // ======================================================================
  let totalsCache = new Map();
  const sumEntries = (es) => es.reduce((s,e) => ({ c:s.c+Number(e.cal||0), p:s.p+Number(e.pro||0), cb:s.cb+Number(e.carb||0), f:s.f+Number(e.fat||0), n:s.n+1 }), { c:0, p:0, cb:0, f:0, n:0 });
  function dayTotals(k){ if(!totalsCache.has(k)) totalsCache.set(k, sumEntries(loadEntries(k))); return totalsCache.get(k); }
  function computeStreak(){
    const t = state.targets; let n = 0; const d = new Date();
    if(dayTotals(keyOf(d)).p < t.protein) d.setDate(d.getDate()-1);
    for(let i=0;i<400;i++){ const dt = dayTotals(keyOf(d)); if(dt.n>0 && dt.p >= t.protein){ n++; d.setDate(d.getDate()-1); } else break; }
    return n;
  }
  function lastWeek(){
    const out = []; const d = new Date(); d.setDate(d.getDate()-6);
    for(let i=0;i<7;i++){ const k = keyOf(d), dt = dayTotals(k); out.push({ key:k, dow:d.toLocaleDateString('en-GB',{weekday:'narrow'}), isSel:k===state.viewKey, c:dt.c, p:dt.p }); d.setDate(d.getDate()+1); }
    return out;
  }
  // 7 complete days ending `off` days before yesterday (today excluded: a half-logged day skews averages)
  function weekStats(off){
    const t = state.targets, days = [];
    for(let i=0;i<7;i++) days.push(shiftKey(todayKey(), -1-off-i));
    const logged = days.map(dayTotals).filter(d => d.n > 0);
    const avg = (f) => logged.length ? logged.reduce((s,d)=>s+f(d),0)/logged.length : null;
    return { days, logged:logged.length, avgC:avg(d=>d.c), avgP:avg(d=>d.p), proHit:logged.filter(d=>d.p>=t.protein).length, from:days[6], to:days[0] };
  }
  function weightSeries(){
    const pts = Object.keys(state.weights).filter(k => state.weights[k] > 0).sort().map(k => ({ k, t:parseKey(k).getTime(), w:Number(state.weights[k]) }));
    pts.forEach(p => { const win = pts.filter(q => q.t <= p.t && q.t > p.t - 7*DAY_MS); p.trend = win.reduce((s,q)=>s+q.w,0)/win.length; });
    return pts;
  }
  function weightRate(pts){
    if(pts.length < 2) return null;
    const last = pts[pts.length-1]; let ref = null;
    for(let i=pts.length-2;i>=0;i--){ if(last.t - pts[i].t >= 6*DAY_MS){ ref = pts[i]; break; } }
    if(!ref) return null;
    return { perWeek: (last.trend - ref.trend) / ((last.t - ref.t)/(7*DAY_MS)) };
  }
  function frequentFoods(n){
    return Object.entries(state.library).filter(([k,f]) => !f.recipeId)
      .sort((a,b) => (b[1].uses||0)-(a[1].uses||0) || (b[1].last||0)-(a[1].last||0)).slice(0, n||8);
  }
  const mealsList = () => Object.values(state.meals).sort((a,b) => (b.uses||0)-(a.uses||0) || (b.last||0)-(a.last||0) || a.name.localeCompare(b.name));
  const recipesList = () => Object.values(state.recipes).sort((a,b) => (b.uses||0)-(a.uses||0) || (b.last||0)-(a.last||0) || a.name.localeCompare(b.name));
  function recipePortion(r){ const t = sumItems(r.items); const s = Math.max(1, Number(r.servings)||1); return { c:t.c/s, p:t.p/s, cb:t.cb/s, f:t.f/s, tc:t.c, tp:t.p }; }

  // Foods/recipes that would close today's protein gap without blowing the calorie budget
  function gapSuggestions(remC, remP){
    const out = [];
    Object.entries(state.library).forEach(([k,f]) => {
      if(f.recipeId && !state.recipes[f.recipeId]) return;
      const t = itemTotals(itemFromFood(f));
      if(t.c <= 0 || t.p < 8 || t.c > remC + 25) return;
      out.push({ k, f, c:t.c, p:t.p, score: t.p/t.c*100 + Math.min(f.uses||0, 10)*0.4 });
    });
    return out.sort((a,b) => b.score - a.score).slice(0,3);
  }

  // ======================================================================
  // Sheets
  // ======================================================================
  function openSheet(name){ fresh.sheet = state.sheet !== name; state.sheet = name; render(); const b = document.querySelector('.sheet .sb'); if(b) b.scrollTop = 0; }
  function closeSheet(){
    state.sheet = null; state.editId = null; state.addQ = ''; state.addMeal = null; state.pendingBarcode = null; state.photo = null;
    state.foodEdit = null; state.saveMeal = null; state.mealEdit = null; state.mealDraft = null;
    state.recipeEdit = null; state.recipeDraft = null; state.recipeQ = ''; state.targetsErr = '';
    render();
  }
  const $ = (id) => document.getElementById(id);
  const val = (id) => { const el = $(id); return el ? el.value : ''; };
  const setVal = (id, v) => { const el = $(id); if(el) el.value = v == null ? '' : v; };

  // ---------- add / edit food ----------
  function openAdd(meal){
    state.addMeal = meal || defaultMeal(); state.editId = null; state.formBasis = 'serving'; state.addQ = ''; state.photo = null; state.pendingBarcode = null;
    openSheet('add');
    setVal('ft-amt', 1); updatePreview();
  }
  function openEditEntry(id){
    if(swipeJustHappened) return;
    const e = state.entries.find(x => x.id === id); if(!e) return;
    state.editId = id; state.addMeal = e.meal || 'Snacks'; state.formBasis = e.basis || 'serving'; state.addQ = ''; state.photo = null;
    openSheet('add');
    setVal('ft-name', e.name);
    setVal('ft-cal', e.baseCal != null ? e.baseCal : e.cal);
    setVal('ft-pro', e.basePro != null ? e.basePro : e.pro);
    setVal('ft-carb', e.baseCarb != null ? e.baseCarb : e.carb);
    setVal('ft-fat', e.baseFat != null ? e.baseFat : e.fat);
    setVal('ft-amt', e.amt != null ? e.amt : 1);
    updatePreview();
  }
  // fill the add form (used by library picks, barcode and label results)

  }, { passive:true });

    if(!sw) return;

      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) sw.active = true;
      else if(Math.abs(dy) > 10){ sw = null; return; }
    }
    if(sw.active){ sw.dx = Math.min(0, dx); sw.el.style.transition = 'none'; sw.el.style.transform = `translateX(${sw.dx}px)`; }
  }, { passive:true });

  // ---------- barcode scanning (Open Food Facts) ----------
  let scanner = null, scanning = false;
  function loadScript(src){
    return new Promise((res, rej) => {

  function scanStatus(t){ const el = $('scan-status'); if(el) el.textContent = t; }
  async function openScanner(){
    const ov = $('scanner'); ov.hidden = false; document.body.classList.add('lock');
    setVal('scan-code', '');
    scanStatus('Starting camera…');
    try{
      await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
      const F = window.Html5QrcodeSupportedFormats;
      scanner = new window.Html5Qrcode('ft-reader', { formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], experimentalFeatures:{ useBarCodeDetectorIfSupported:true }, verbose:false });
      scanning = true;
      await scanner.start({ facingMode:'environment' }, { fps:12, qrbox:{ width:260, height:120 } }, (code) => { if(scanning){ scanning = false; buzz(); lookupBarcode(code); } }, () => {});
      scanStatus('Point the camera at the barcode');

      scanning = false;

  async function stopScanner(){

  function lookupTyped(){ const c = val('scan-code').replace(/\D/g,''); if(c.length < 6){ scanStatus('That doesn’t look like a barcode number.'); return; } scanning = false; lookupBarcode(c); }
  async function lookupBarcode(code){
    // already saved?
    const known = Object.values(state.library).find(f => f.barcode === code);
    if(known){ finishScan(); fillForm(known); toast('Found ' + known.name + ' in your foods'); return; }
    scanStatus('Looking up ' + code + '…');
    try{
      const res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,product_name_en,brands,nutriments,serving_quantity');
      const data = await res.json();
      const p = data && data.product;
      const n = p && p.nutriments || {};
      let kcal = num(n['energy-kcal_100g']);
      if(kcal == null && num(n['energy_100g']) != null) kcal = n['energy_100g'] / 4.184;
      if(!p || data.status === 0 || kcal == null){
        state.pendingBarcode = code;
        finishScan();
        toast('Not in the food database — enter it once and it’ll be remembered');
        const n = $('ft-name'); if(n) n.focus();
        return;
      }
      const brand = String(p.brands || '').split(',')[0].trim();
      let name = (p.product_name_en || p.product_name || 'Scanned food').trim();
      if(brand && !name.toLowerCase().includes(brand.toLowerCase())) name = brand + ' ' + name;
      const f = { name, cal: r1(kcal), pro: r1(num(n['proteins_100g']) || 0), basis:'100g' };
      if(num(n['carbohydrates_100g']) != null) f.carb = r1(n['carbohydrates_100g']);
      if(num(n['fat_100g']) != null) f.fat = r1(n['fat_100g']);
      const serving = num(p.serving_quantity);
      state.pendingBarcode = code;
      finishScan();
      fillForm(f, serving && serving > 0 ? r1(serving) : 100);
      toast('Found it — check the amount, then Add');
    }catch(e){
      scanStatus('Couldn’t reach the food database. Check your connection.');
      scanning = true;
    }
  }
  function finishScan(){

  // ---------- AI photo logging (labels and plates) ----------
  const PHOTO_SCHEMA = {
    type:'object', additionalProperties:false,
    required:['kind','name','kcal_per_100g','protein_per_100g','carbs_per_100g','fat_per_100g','serving_g','items','note'],
    properties:{
      kind:{ type:'string', enum:['label','plate'] },
      name:{ type:'string' },
      kcal_per_100g:{ type:'number' }, protein_per_100g:{ type:'number' }, carbs_per_100g:{ type:'number' }, fat_per_100g:{ type:'number' },
      serving_g:{ type:'number' },
      items:{ type:'array', items:{ type:'object', additionalProperties:false, required:['name','grams','kcal','protein','carbs','fat'],
        properties:{ name:{type:'string'}, grams:{type:'number'}, kcal:{type:'number'}, protein:{type:'number'}, carbs:{type:'number'}, fat:{type:'number'} } } },
      note:{ type:'string' }
    }
  };
  function triggerPhoto(){
    if(!state.workerUrl){ toast('Connect the coach first: Settings → Coach'); return; }
    const i = $('ft-photo'); i.value = ''; i.click();
  }
  function shrinkImage(file){
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
      img.src = url;
    });
  }
  async function onPhoto(e){
    const file = e.target.files && e.target.files[0]; if(!file) return;
    state.photo = { busy:true }; render();
    try{
      const data64 = await shrinkImage(file);
      const prompt = 'This photo is either a UK nutrition label or a plate/meal of food.\n'
        + 'If it is a nutrition label: kind="label"; give the product name if visible (else a short description); copy the per-100g energy (kcal), protein, carbohydrate and fat EXACTLY as printed; serving_g = the stated portion size in grams (0 if none); items = [].\n'
        + 'If it is food on a plate: kind="plate"; estimate each distinct item with a realistic UK portion weight and its kcal, protein, carbs and fat for that weight; set the per-100g fields and serving_g to 0; name = a short name for the meal.\n'
        + 'note = one short sentence on confidence or anything to double-check.';
      const data = await callClaude({
        model: MODEL, max_tokens: 1500,
        output_config: { effort:'low', format:{ type:'json_schema', schema: PHOTO_SCHEMA } },
        messages: [{ role:'user', content: [ { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:data64 } }, { type:'text', text:prompt } ] }]
      });
      if(data.error) throw new Error(data.error.message || 'API error');
      if(data.stop_reason === 'refusal') throw new Error('The coach couldn’t read that photo.');
      const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      const out = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
      if(out.kind === 'label' && out.kcal_per_100g > 0){
        state.photo = null;
        const f = { name: out.name || 'Scanned label', cal: r1(out.kcal_per_100g), pro: r1(out.protein_per_100g||0), basis:'100g' };
        if(state.showMacros){ f.carb = r1(out.carbs_per_100g||0); f.fat = r1(out.fat_per_100g||0); }
        fillForm(f, out.serving_g > 0 ? r1(out.serving_g) : 100);
        toast('Label read — check the numbers, then Add');
      } else if(Array.isArray(out.items) && out.items.length){
        state.photo = { items: out.items.map(it => ({ ...it, uid:uid() })), note: out.note || '' };
        render();
      } else throw new Error(out.note || 'Couldn’t find food in that photo.');
    }catch(err){
      state.photo = { error: (err && err.message && err.message !== 'image') ? err.message : 'Couldn’t read that photo — try again with better light.' };
      render();
    }
  }

    syncRecipe();
    const name = val('ft-rc-name').trim(), d = state.recipeDraft, servings = Math.max(1, Number(d.servings)||1);

    const next = { ...beforeR }; delete next[id]; saveRecipes(next);
    const lib = { ...beforeL }; Object.keys(lib).forEach(k => { if(lib[k].recipeId === id) delete lib[k]; }); saveLibrary(lib);
    closeSheet(); toast('Deleted ' + r.name, () => { saveRecipes(beforeR); saveLibrary(beforeL); });

  function bumpRecipe(id){ const r = state.recipes[id]; if(r) saveRecipes({ ...state.recipes, [id]: { ...r, uses:(r.uses||0)+1, last:Date.now() } }); }
  function logRecipe(id, portions){
    const r = state.recipes[id]; if(!r) return;
    const food = Object.values(state.library).find(f => f.recipeId === id);
    const per = recipePortion(r), before = state.entries, meal = defaultMeal();
    const it = { name:r.name, baseCal:Math.round(per.c), basePro:r1(per.p), basis:'serving', amt:portions || 1 };
    if(food && food.carb != null) it.baseCarb = food.carb;

    bumpRecipe(id); buzz();
    persistEntries([...before, makeEntry(it, meal, { recipeId:id })]);

  }

  // ---------- food library ----------
  function guessGrams(name){ const m = String(name).match(/(\d+(?:\.\d+)?)\s*(?:g|ml)\b/i) || String(name).match(/-\s*(\d+(?:\.\d+)?)\s*$/); return m ? Number(m[1]) : ''; }
  function stripAmount(name){ return String(name).replace(/\s*[-–]?\s*\(?\d+(?:\.\d+)?\s*(?:g|ml)?\)?\s*$/i, '').trim() || name; }
  function openFood(key){
    const f = key === '__new' ? { name:'', cal:'', pro:'', basis:'serving' } : state.library[key]; if(!f) return;

    ['ft-fe-cal','ft-fe-pro','ft-fe-carb','ft-fe-fat'].forEach(id => { if(val(id) !== '') setVal(id, r1(Number(val(id))*100/g)); });

  function saveFood(){
    const name = val('ft-fe-name').trim(), cal = Number(val('ft-fe-cal')), pro = Math.max(0, Number(val('ft-fe-pro'))||0);
    if(!name || val('ft-fe-cal') === '' || !(cal >= 0)){ toast('Name and kcal are required'); return; }
    const oldKey = state.foodEdit, newKey = name.toLowerCase(), before = state.library, lib = { ...before };
    const old = oldKey !== '__new' ? lib[oldKey] || {} : {};
    let uses = old.uses || 0, last = old.last || 0;
    if(newKey !== oldKey && lib[newKey]){
      if(!confirm('"' + lib[newKey].name + '" already exists. Replace it with these values?')) return;
      uses += lib[newKey].uses || 0; last = Math.max(last, lib[newKey].last || 0);
    }
    if(oldKey !== '__new') delete lib[oldKey];
    const f = { ...old, name, cal, pro, basis:state.feBasis, lastAmt: state.feBasis === (old.basis||'serving') ? old.lastAmt : undefined, uses, last };
    const carb = num(val('ft-fe-carb')), fat = num(val('ft-fe-fat'));
    if(state.showMacros){ if(carb != null) f.carb = carb; else delete f.carb; if(fat != null) f.fat = fat; else delete f.fat; }

  function importFile(e){
    const file = e.target.files && e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || typeof data !== 'object') throw new Error('bad');
        let n = 0;
        const merge = (key, obj) => { if(obj && typeof obj === 'object') lsSet(key, JSON.stringify({ ...lsJSON(key, {}), ...obj })); };
        if(data.app === 'fuel-tracker'){
          if(data.targets) lsSet(K.targets, JSON.stringify(data.targets));
          if(data.library) lsSet(K.library, JSON.stringify(data.library));
          merge(K.weights, data.weights); merge(K.meals, data.meals); merge(K.recipes, data.recipes); merge(K.water, data.water);
          if(typeof data.theme === 'string') lsSet(K.themeName, data.theme);
          else if(data.theme != null && !lsGet(K.themeName)) lsSet(K.theme, String(data.theme));
          Object.keys(data.days || {}).forEach(k => { const es = data.days[k]; if(/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(es) && es.length){ lsSet(entryKey(k), JSON.stringify(es)); n++; } });
        } else {
          const keys = Object.keys(data).filter(k => k.indexOf('fuel-') === 0);
          if(!keys.length) throw new Error('bad');
          keys.forEach(k => { lsSet(k, typeof data[k] === 'string' ? data[k] : JSON.stringify(data[k])); if(k.indexOf('fuel-entries:')===0) n++; });
        }
        applyStored();
        const w = lsGet(K.worker); if(w) state.workerUrl = w;
        toast('Imported ' + n + ' days ✓');
      }catch(err){ toast('That file couldn’t be read'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  // ======================================================================

  async function callClaude(body){
    const headers = { 'Content-Type':'application/json' };
    if(state.token) headers['X-App-Token'] = state.token;
    const res = await fetch(state.workerUrl, { method:'POST', headers, body: JSON.stringify(body) });
    return res.json();
  }
  function buildSystem(){
    const s = sumEntries(state.entries), t = state.targets;
    const remC = Math.max(0, t.calories - s.c), remP = Math.max(0, t.protein - s.p);
    const logged = state.entries.length ? state.entries.map(e => `${e.name}${e.amt!=null && amtLabel(e.basis,e.amt) ? ' '+amtLabel(e.basis,e.amt) : ''} (${Math.round(e.cal)} kcal, ${Math.round(e.pro)}g, ${e.meal||'Snacks'})`).join('; ') : 'nothing yet';
    const foods = frequentFoods(20).map(([k,f]) => `${f.name} (${Math.round(f.cal)} kcal, ${r1(f.pro)}g${f.basis==='100g'?' per 100g':''})`).join('; ');
    const meals = mealsList().slice(0,10).map(m => { const x = sumItems(m.items); return `${m.name} (${Math.round(x.c)} kcal, ${Math.round(x.p)}g)`; }).join('; ');
    const recipes = recipesList().slice(0,10).map(r => { const x = recipePortion(r); return `${r.name} (${Math.round(x.c)} kcal, ${Math.round(x.p)}g per portion)`; }).join('; ');
    const wk = weekStats(0), pts = weightSeries(), rate = weightRate(pts);
    const weekLine = wk.logged ? `Last 7 full days: ${wk.logged} days logged, avg ${Math.round(wk.avgC)} kcal, protein target hit on ${wk.proHit} of ${wk.logged} days` : 'Last 7 full days: nothing logged';
    const perDay = wk.days.slice().reverse().map(k => { const d = dayTotals(k); return `${shortDate(k)}: ${d.n ? Math.round(d.c) + ' kcal / ' + Math.round(d.p) + 'g' : 'not logged'}${state.weights[k] ? ', ' + state.weights[k] + ' kg' : ''}`; }).join('; ');
    const weightLine = pts.length ? `Weight trend: ${r1(pts[pts.length-1].trend)} kg${rate ? `, ${rate.perWeek>=0?'+':''}${r1(rate.perWeek)} kg/week` : ''}` : 'Weight: not tracked yet';
    const macroLine = state.showMacros ? `\nCarbs today: ${Math.round(s.cb)}g, fat today: ${Math.round(s.f)}g` : '';
    const waterLine = `\nWater today: ${((state.water[state.viewKey]||0)/1000).toFixed(2)} of ${((t.water||2500)/1000).toFixed(1)} L`;
    return `You are a blunt, practical nutrition coach inside a calorie/protein tracker. Keep answers to 2-4 sentences, specific and actionable — no fluff, no medical disclaimers. This person is on a cutting phase. Use British English.\nDay: ${state.viewKey}\nDaily target: ${t.calories} kcal, ${t.protein}g protein\nEaten: ${Math.round(s.c)} kcal, ${Math.round(s.p)}g protein\nRemaining: ${Math.round(remC)} kcal, ${Math.round(remP)}g protein${macroLine}${waterLine}\nLogged today: ${logged}\n${weekLine}\nDay by day: ${perDay}\n${weightLine}\nRegular foods: ${foods || 'none saved'}\nSaved meals: ${meals || 'none'}\nBatch recipes: ${recipes || 'none'}\nIf asked what to eat, give 1-2 concrete options that fit the remaining budget, ideally from their regular foods, meals or recipes. For a weekly review you may use up to 6 sentences or a short list.`;
  }
  function chatHistory(){
    const msgs = [];
    state.chat.forEach(m => {
      if(m.role !== 'user' && m.role !== 'ai') return;
      const role = m.role === 'user' ? 'user' : 'assistant';
      if(msgs.length && msgs[msgs.length-1].role === role) msgs[msgs.length-1].content += '\n' + m.text;
      else msgs.push({ role, content:m.text });
    });
    let recent = msgs.slice(-12);
    while(recent.length && recent[0].role !== 'user') recent = recent.slice(1);
    return recent;
  }
  async function ask(preset){
    const q = (preset || val('ft-coach')).trim();
    if(!q || state.asking) return;
    setVal('ft-coach', '');
    if(!state.workerUrl){ state.chat = [...state.chat, {role:'user', text:q}, {role:'sys', text:'Connect the coach first: Settings → Coach → paste your Cloudflare Worker URL.'}]; render(); return; }
    state.chat = [...state.chat, {role:'user', text:q}, {role:'load', text:'Thinking…'}];
    state.asking = true; render(); scrollChat();
    let reply = { role:'sys', text:"Couldn't reach the coach just now — try again in a moment." };
    try{
      const data = await callClaude({ model:MODEL, max_tokens:2000, output_config:{ effort:'low' }, system:buildSystem(), messages:chatHistory() });
      if(data.error) reply = { role:'sys', text:'Coach error: ' + (data.error.message || JSON.stringify(data.error)) };
      else if(data.stop_reason === 'refusal') reply = { role:'sys', text:'The coach declined that one — try rephrasing.' };
      else {
        const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
        reply = text ? { role:'ai', text: data.stop_reason === 'max_tokens' ? text + ' …' : text } : { role:'sys', text:'Got an empty response — try rephrasing.' };
      }
    }catch(e){ reply = { role:'sys', text:"Couldn't reach the Worker — check the URL and access token in Settings." }; }
    state.chat = [...state.chat.filter(m => m.role !== 'load'), reply];
    state.asking = false; render(); scrollChat();
  }

      `<button class="${state.tab===k?'on':''}" onclick="App.setTab('${k}')" aria-label="${l}">${I[k]}${l}</button>`).join('') + `</div></nav>`;

  // ---------- Today ----------
  function buildToday(){
    const t = state.targets, s = sumEntries(state.entries), c = s.c, p = s.p;
    const rem = t.calories - c, over = rem < 0, isToday = state.viewKey === todayKey();
    const title = isToday ? 'Today' : state.viewKey === shiftKey(todayKey(),-1) ? 'Yesterday' : parseKey(state.viewKey).toLocaleDateString('en-GB',{weekday:'long'});
    const hr = new Date().getHours(), greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
    const streak = computeStreak();
    let h = `<div class="page">
      <div class="top">
        <div>
          <div class="eyebrow">${isToday ? greet : '&nbsp;'}</div>
          <h1 class="title">${esc(title)}</h1>
          <div class="datenav" style="margin-top:4px;">
            <button onclick="App.goDay(-1)" aria-label="Previous day">${I.left}</button>
            <span>${esc(longDate(state.viewKey))}</span>
            <button onclick="App.goDay(1)" aria-label="Next day" ${isToday?'disabled':''}>${I.right}</button>
            ${!isToday ? `<button class="todaylink" style="width:auto;height:auto;" onclick="App.pickDay('${todayKey()}')">Today</button>` : ''}
          </div>
        </div>
        <div class="iconbtns">
          <button class="ibtn" onclick="App.openSheet('calendar')" aria-label="Calendar">${I.cal}</button>
          <button class="ibtn" onclick="App.openSettings()" aria-label="Settings">${I.gear}</button>
        </div>
      </div>`;

    const due = backupDue();
    if(due) h += `<div class="banner"><span>${due < 0 ? 'You’ve never backed up your log. Your data only lives in this browser.' : 'No backup for ' + due + ' days. Your data only lives in this browser.'}</span><button class="link quiet" onclick="App.snoozeBackup()">Later</button><button class="btn sm" onclick="App.exportData()">Back up</button></div>`;

    // summary ring
    const R = 84, C = 2*Math.PI*R, pct = Math.min(1, c / t.calories);
    const overPct = over ? Math.min(1, -rem / t.calories) : 0;
    h += `<div class="card summary">
      <div class="ringwrap">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--track)" stroke-width="14"/>
          <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/>
          ${over ? `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--warn)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*overPct).toFixed(1)} ${C.toFixed(1)}"/>` : ''}
        </svg>
        <div class="ringtxt"><div class="big num" style="${over?'color:var(--warn)':''}">${fmt(Math.abs(rem))}</div><div class="lbl">${over ? 'kcal over' : 'kcal left'}</div></div>
      </div>
      <div class="sumrow">

    // close the gap

        const extra = state.showMacros && (e.carb != null || e.fat != null) ? ` · ${r1(e.carb||0)} c · ${r1(e.fat||0)} f` : '';
        h += `<div class="swipe"><div class="swipe-bg">Delete</div><button class="entry" data-id="${esc(e.id)}" onclick="App.openEditEntry(${arg(e.id)})">

  // ---------- Progress ----------
  function buildProgress(){
    const t = state.targets, cur = weekStats(0), prev = weekStats(7);

        <div class="card-hdr"><span class="h2">This week</span><span class="sub">last 7 full days</span></div>
        <div class="tiles">

    // 7-day bars
    const mode = state.trendMode, week = lastWeek(), tgt = mode==='cal' ? t.calories : t.protein;
    const maxV = Math.max(tgt, ...week.map(d => mode==='cal'?d.c:d.p), 1);
    const withData = week.filter(d => (mode==='cal'?d.c:d.p) > 0);
    const avg = withData.length ? Math.round(withData.reduce((s,d)=>s+(mode==='cal'?d.c:d.p),0)/withData.length) : 0;
    h += `<div class="card">
      <div class="card-hdr"><span class="h2">Last 7 days</span>
        <span class="seg"><button class="${mode==='cal'?'on':''}" onclick="App.setTrend('cal')">Calories</button><button class="${mode==='pro'?'on':''}" onclick="App.setTrend('pro')">Protein</button></span></div>
      <div class="bars"><div class="tline" style="bottom:calc(20px + (100% - 20px) * ${(tgt/maxV).toFixed(3)});"></div>`;
    week.forEach(d => {
      const v = mode==='cal' ? d.c : d.p, pct = Math.max(v>0?6:0, Math.round(v/maxV*100));
      const col = v === 0 ? 'var(--track)' : mode==='cal' ? (v > t.calories ? 'var(--warn)' : 'var(--accent)') : (v >= t.protein ? 'var(--pro)' : hexA(theme().pro, 0.45));
      h += `<button class="barcol" onclick="App.pickDay('${d.key}');App.setTab('today')" aria-label="${esc(shortDate(d.key))}: ${Math.round(v)}${mode==='cal'?' kcal':' g protein'}">
        <div class="barwrap"><div class="bar" style="height:${pct}%;min-height:4px;background:${col};"></div></div><span class="${d.key===todayKey()?'on':''}">${esc(d.dow)}</span></button>`;
    });
    h += `</div><div class="foot"><span>Average ${mode==='cal' ? fmt(avg)+' kcal' : avg+' g'}</span><span>Target ${mode==='cal' ? fmt(t.calories)+' kcal' : t.protein+' g'}</span></div></div>`;

    // weight
    const pts = weightSeries(), rate = weightRate(pts), latest = pts[pts.length-1];
    const wid = 'ft-wt-' + state.viewKey, curW = state.weights[state.viewKey];
    h += `<div class="card">
      <div class="card-hdr"><span class="h2">Weight</span><span class="sub">${state.viewKey === todayKey() ? 'today' : esc(shortDate(state.viewKey))}</span></div>

    if(latest){
      h += `<div class="wsum"><span>Trend <b class="num">${r1(latest.trend)} kg</b></span>`;
      if(rate){
        h += `<span>${rate.perWeek <= 0 ? '▼' : '▲'} <b class="num">${r1(Math.abs(rate.perWeek))} kg</b> per week</span>`;
        if(cur.logged >= 4 && cur.avgC != null){ const m = cur.avgC - rate.perWeek*7700/7; if(m > 1000 && m < 5000) h += `<span>Est. maintenance ≈ <b class="num">${fmt(Math.round(m/10)*10)}</b> kcal</span>`; }
      } else h += `<span class="muted">weekly rate after a week of weigh-ins</span>`;
      h += `</div>`;
    }
    if(pts.length >= 2){
      h += `<div class="chartwrap">${buildWeightChart(pts)}<div class="tip" id="ft-wtip"></div></div>
        <div class="legend"><span><i style="width:8px;height:8px;border-radius:50%;background:var(--pro);display:inline-block;"></i>Weigh-in</span><span><i style="width:16px;height:2px;border-radius:1px;background:var(--accent);display:inline-block;"></i>7-day trend</span></div>`;
    } else {
      h += `<div class="hint" style="margin-top:12px;">${pts.length ? 'One weigh-in so far — add a few more and your trend line appears.' : 'Weigh in a few mornings a week, before eating. The trend line smooths out day-to-day water swings.'}</div>`;
    }
    h += `</div></div>`;
    return h;
  }
  let chartPts = [];
  function buildWeightChart(pts){
    const W = 320, H = 140, L = 34, R = 8, T = 10, B = 22;
    const end = parseKey(todayKey()).getTime(), start = Math.max(pts[0].t, end - 59*DAY_MS);
    const shown = pts.filter(p => p.t >= start);
    const vals = shown.flatMap(p => [p.w, p.trend]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if(hi - lo < 2){ const mid = (hi+lo)/2; lo = mid - 1; hi = mid + 1; }
    lo = Math.floor(lo*2)/2 - 0.5; hi = Math.ceil(hi*2)/2 + 0.5;
    const span = Math.max(end - start, DAY_MS);
    const x = (tt) => L + (tt - start)/span*(W - L - R), y = (v) => T + (hi - v)/(hi - lo)*(H - T - B);
    chartPts = shown.map(p => ({ ...p, x:x(p.t), y:y(p.w), ty:y(p.trend) }));
    let s = `<svg id="ft-wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">`;
    for(let i=0;i<3;i++){ const v = lo + (hi-lo)*i/2, yy = y(v);
      s += `<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,0.06)"/><text x="${L-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" fill="#6b7180" font-size="9.5" font-family="Inter">${r1(v)}</text>`; }
    s += `<text x="${L}" y="${H-5}" fill="#6b7180" font-size="9.5" font-family="Inter">${esc(shortDate(keyOf(new Date(start))))}</text><text x="${W-R}" y="${H-5}" text-anchor="end" fill="#6b7180" font-size="9.5" font-family="Inter">Today</text>`;
    s += `<line id="ft-wguide" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="rgba(255,255,255,0.22)" style="display:none"/>`;
    chartPts.forEach(p => { s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--pro)" stroke="var(--card)" stroke-width="2"/>`; });
    if(chartPts.length > 1) s += `<polyline points="${chartPts.map(p => p.x.toFixed(1)+','+p.ty.toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += `<circle id="ft-wfocus" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2" style="display:none"/>`;
    s += `<rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" onpointermove="App.chartHover(event)" onpointerdown="App.chartHover(event)" onpointerleave="App.chartLeave(event)"/></svg>`;
    return s;
  }
  function chartHover(ev){
    const el = $('ft-wchart'), tip = $('ft-wtip'); if(!el || !tip || !chartPts.length) return;
    const rect = el.getBoundingClientRect(), sx = (ev.clientX - rect.left)/rect.width*320;
    let best = chartPts[0]; chartPts.forEach(p => { if(Math.abs(p.x - sx) < Math.abs(best.x - sx)) best = p; });
    const g = $('ft-wguide'), f = $('ft-wfocus');
    g.setAttribute('x1', best.x); g.setAttribute('x2', best.x); g.style.display = '';
    f.setAttribute('cx', best.x); f.setAttribute('cy', best.ty); f.style.display = '';
    tip.innerHTML = `<b>${esc(shortDate(best.k))}</b> · ${r1(best.w)} kg<br><span style="color:#555;">trend ${r1(best.trend)} kg</span>`;
    tip.style.display = 'block';
    tip.style.left = Math.max(64, Math.min(rect.width - 64, best.x/320*rect.width)) + 'px';
  }
  function chartLeave(ev){ if(ev && ev.pointerType && ev.pointerType !== 'mouse') return; ['ft-wtip','ft-wguide','ft-wfocus'].forEach(id => { const el = $(id); if(el) el.style.display = 'none'; }); }

  function buildAddSheet(){
